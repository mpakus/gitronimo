[workspace]
members = [
    "apps/desktop",
    "crates/app_core",
    "crates/git_cli",
    "crates/git_domain",
    "crates/test_support",
    "crates/ui_kit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitronimo/gitronimo"
homepage = "https://github.com/gitronimo/gitronimo"
description = "A native macOS Git client written in Rust."

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
gpui = "=0.2.2"
notify = "=8.2.0"
