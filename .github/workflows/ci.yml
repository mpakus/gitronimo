name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

  package-development:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - run: cargo build --release -p gitronimo-desktop
      - run: cargo packager --release --formats app --manifest-path apps/desktop/Cargo.toml --out-dir target/release
      - uses: actions/upload-artifact@v7
        with:
          name: Gitronimo-unsigned-macos
          path: target/release/Gitronimo.app
