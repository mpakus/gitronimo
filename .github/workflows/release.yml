name: Release macOS app

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_BASE64:?set repository secret MACOS_CERTIFICATE_BASE64}"
          : "${MACOS_CERTIFICATE_PASSWORD:?set repository secret MACOS_CERTIFICATE_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?set repository secret KEYCHAIN_PASSWORD}"
          : "${DEVELOPER_ID_APPLICATION:?set repository secret DEVELOPER_ID_APPLICATION}"
          certificate_path="$RUNNER_TEMP/gitronimo-release.p12"
          keychain_path="$RUNNER_TEMP/gitronimo-release.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          rm -f "$certificate_path"
      - name: Build architecture-specific bundles
        run: |
          cargo build --release -p gitronimo-desktop
          cargo packager --release --formats app --manifest-path apps/desktop/Cargo.toml --out-dir "$GITHUB_WORKSPACE/target/release-arm" --binaries-dir "$GITHUB_WORKSPACE/target/release"
          cargo build --release -p gitronimo-desktop --target x86_64-apple-darwin
          cargo packager --release --formats app --target x86_64-apple-darwin --manifest-path apps/desktop/Cargo.toml --out-dir "$GITHUB_WORKSPACE/target/release-intel" --binaries-dir "$GITHUB_WORKSPACE/target/x86_64-apple-darwin/release"
      - name: Create, sign, and notarize universal bundle
        shell: bash
        run: |
          set -euo pipefail
          app_path="target/release-universal/GitRonimo.app"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          mkdir -p target/release-universal
          ditto target/release-arm/GitRonimo.app "$app_path"
          lipo -create target/release-arm/GitRonimo.app/Contents/MacOS/GitRonimo target/release-intel/GitRonimo.app/Contents/MacOS/GitRonimo -output "$app_path/Contents/MacOS/GitRonimo"
          codesign --force --deep --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" target/release-universal/GitRonimo-${GITHUB_REF_NAME}.zip
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          zip_path="target/release-universal/GitRonimo-${GITHUB_REF_NAME}.zip"
          notary_ok=0
          for attempt in 1 2 3 4 5; do
            echo "notarytool submit --wait attempt ${attempt}"
            if xcrun notarytool submit "$zip_path" --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 1800; then
              notary_ok=1
              break
            fi
            echo "notarytool wait failed (often an App Store Connect HTTP timeout); retrying..."
            sleep 20
          done
          if [[ "$notary_ok" -ne 1 ]]; then
            echo "notarization did not finish after retries" >&2
            exit 1
          fi
          rm -f "$api_key_path"
          xcrun stapler staple "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          rm -f "$zip_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"
          shasum -a 256 "$zip_path" > target/release-universal/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: GitRonimo-signed-macos
          path: |
            target/release-universal/GitRonimo-${{ github.ref_name }}.zip
            target/release-universal/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip_path="target/release-universal/GitRonimo-${GITHUB_REF_NAME}.zip"
          sums_path="target/release-universal/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip_path" "$sums_path" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" "$zip_path" "$sums_path" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
