name: macOS build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "crates/ui_kit/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

