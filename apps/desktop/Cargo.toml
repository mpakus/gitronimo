[package]
name = "gitronimo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false

[[bin]]
name = "GitRonimo"
path = "src/main.rs"

[dependencies]
app_core = { path = "../../crates/app_core", version = "0.1.0" }
git_cli = { path = "../../crates/git_cli", version = "0.1.0" }
git_domain = { path = "../../crates/git_domain", version = "0.1.0" }
git_gix = { path = "../../crates/git_gix", version = "0.1.0" }
hosting_github = { path = "../../crates/hosting_github", version = "0.1.0" }
gpui.workspace = true
notify.workspace = true
platform_macos = { path = "../../crates/platform_macos", version = "0.1.0" }
ui_kit = { path = "../../crates/ui_kit", version = "0.1.0" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[package.metadata.packager]
product-name = "GitRonimo"
# Keep in sync with APP_VERSION in src/views/about.rs (user-facing product version).
version = "2.0.4"
identifier = "com.gitronimo.desktop"
category = "DeveloperTool"
copyright = "Copyright (c) 2026 Gitronimo contributors"
# Dock / Finder icon. Rebuild from ../../icon.png with iconutil when the PNG changes.
icons = ["../../assets/gitronimo.icns"]

[[package.metadata.packager.binaries]]
path = "GitRonimo"
main = true

[lints]
workspace = true
